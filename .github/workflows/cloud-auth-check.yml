name: Cloud authentication check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-auth-development
  cancel-in-progress: false
jobs:
  authenticate:
    if: github.ref == 'refs/heads/main'
    environment: development
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Verify Cloud Run read access without provisioning compute
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: gcloud run services list --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(metadata.name)'
